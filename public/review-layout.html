<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nakama layout review</title><style>*{box-sizing:border-box}body{margin:0;background:#303030;color:#fff;font:14px system-ui}nav{display:flex;gap:12px;align-items:center;padding:12px;flex-wrap:wrap}a{color:#fff}iframe{display:block;margin:0 auto;border:1px solid #888;height:900px;background:#050505}input{width:90px}</style></head><body><nav><label>Viewport width <select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option><option>320</option></select></label><label>Section <select id="section"><option value="presence-title">Connected presence</option><option value="proof">Documented presence</option><option value="faq">FAQ</option><option value="home-contact-title">Contact</option><option value="top">Hero</option></select></label><button id="apply">View layout</button><label><input id="motion" type="checkbox">Reduce motion</label></nav><iframe title="Website responsive preview" id="site" width="1440" src="/#top"></iframe><script>const f=document.getElementById('site');document.getElementById('apply').onclick=()=>{f.width=document.getElementById('width').value;f.src='/#'+document.getElementById('section').value};document.getElementById('motion').onchange=e=>{let d=f.contentDocument;let s=d.getElementById('review-reduced');if(s)s.remove();if(e.target.checked){s=d.createElement('style');s.id='review-reduced';s.textContent='*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1!important;transform:none!important}';d.head.append(s)}};</script></body></html>
