<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nakama layout review</title><style>*{box-sizing:border-box}body{margin:0;background:#303030;color:#fff;font:14px system-ui}nav{display:flex;gap:12px;align-items:center;padding:12px;flex-wrap:wrap}iframe{display:block;margin:0 auto;border:1px solid #888;background:#15191f}</style></head><body><nav><label>Viewport width <select id="width"><option>1366</option><option>1920</option><option>1440</option><option>1024</option><option>768</option><option>390</option><option>320</option></select></label><label>Viewport height <select id="height"><option>768</option><option>900</option><option>700</option><option>640</option><option>568</option></select></label><label>Section <select id="section"><option value="top">Hero</option><option value="features">Features</option><option value="presence-title">Connected presence</option><option value="proof">Documented presence</option><option value="faq">FAQ</option><option value="home-contact-title">Contact</option></select></label><button id="apply">View layout</button></nav><iframe title="Website responsive preview" id="site" width="1366" height="768" src="/#top"></iframe><script>const f=document.getElementById('site');document.getElementById('apply').onclick=()=>{f.width=document.getElementById('width').value;f.height=document.getElementById('height').value;f.src='/#'+document.getElementById('section').value};</script></body></html>
